# Systars Linting Workflow
#
# Runs code quality checks on push and pull requests.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository
permissions:
  contents: read

jobs:
  # Every step calls the `just` recipe that `just ci` runs, so CI and a local `just ci`
  # check the same paths with the same waivers.
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install project with dev dependencies
        # The dev extra pins ruff to match .pre-commit-config.yaml
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: just lint-python

      - name: Ruff format check
        run: just format-check

      - name: Mypy
        run: just typecheck

  rtl-lint:
    name: RTL Lint (Verilator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated release lookup: avoids the shared-runner API rate limit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: "2025-12-12"

      - name: Install project
        run: pip install -e .

      - name: Generate RTL (every target in systars.targets)
        run: just gen

      - name: Lint with Verilator (waivers in the justfile)
        run: just lint-rtl

  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
