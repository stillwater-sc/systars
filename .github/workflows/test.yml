# Systars Testing Workflow
#
# Runs unit tests and RTL simulation tests.

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository
permissions:
  contents: read

jobs:
  # Every step calls a `just` recipe, as `just ci` does.
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install OSS CAD Suite (Yosys)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated release lookup: avoids the shared-runner API rate limit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: "2025-12-12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        if: matrix.python-version != '3.11'
        run: just test-unit

      # On 3.11 the coverage run is the unit-test run (the same tests, once)
      - name: Run unit tests with coverage
        if: matrix.python-version == '3.11'
        run: just test-cov xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  rtl-tests:
    name: RTL Tests (cocotb ${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simulator: [verilator]
        # The suites `just test-cocotb` runs
        component: [pe, pe_array, systolic_array, scratchpad, accumulator, systolic_top]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated release lookup: avoids the shared-runner API rate limit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: "2025-12-12"

      - name: Install project with simulation dependencies
        run: pip install -e ".[dev,sim]"

      - name: Run cocotb tests (each Makefile generates its RTL through systars.targets)
        env:
          SIM: ${{ matrix.simulator }}
        run: just test-cocotb-component ${{ matrix.component }}
