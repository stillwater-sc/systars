# Systars Documentation Workflow
#
# Builds the Starlight site in docs-site/ from docs/ (and CHANGELOG.md) and
# deploys it to GitHub Pages: the same setup as stillwater-sc/universal and
# stillwater-sc/mtl5. A broken internal link or anchor fails the build
# (starlight-links-validator, and sync-content.mjs for relative links).

name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"

# Least privilege by default; the deploy job requests what it needs
permissions:
  contents: read

env:
  # Run every JavaScript action on Node 24 (the default from 2026-06-02)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    # Builds are per-ref: a newer push supersedes an older build of the same ref,
    # but a pull-request build can never cancel a main-branch deployment
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build needs no authenticated git access
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Astro raises its Node floor in patch releases (7.4 needs >= 22.23.4),
          # so take the latest 22.x rather than the runner image's cached one
          check-latest: true
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deployment at a time; never cancel one that is in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
