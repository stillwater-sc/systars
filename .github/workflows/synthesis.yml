# Systars Synthesis Workflow
#
# Verifies that every generated module (systars.targets) maps onto each Yosys target,
# and publishes a resource utilization report. Every step calls the same `just`
# recipe used locally.

name: Synthesis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repository
permissions:
  contents: read

jobs:
  yosys-synthesis:
    name: Yosys Synthesis Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [ice40, ecp5, polarfire, generic]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated release lookup: avoids the shared-runner API rate limit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: "2025-12-12"

      - name: Verify Yosys
        run: yosys --version

      - name: Install project
        run: pip install -e .

      - name: Generate RTL
        run: just gen

      - name: Combined hierarchy check
        if: matrix.target == 'generic'
        run: just synth-check

      - name: Synthesize for ${{ matrix.target }}
        run: just synth ${{ matrix.target }}

  resource-report:
    name: Resource Utilization Report
    runs-on: ubuntu-latest
    needs: yosys-synthesis
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up just
        uses: extractions/setup-just@v2

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          # Authenticated release lookup: avoids the shared-runner API rate limit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: "2025-12-12"

      - name: Install project
        run: pip install -e .

      - name: Generate RTL
        run: just gen

      - name: Generate resource report
        run: just synth-report resource_report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: resource-report
          path: resource_report.md
